name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
      MAESTRO_VERSION: "2.13.0"
      MAESTRO_SHA256: ccc536679ed35e3a84b7e9e5c364f2371204c291fb331fec8c00e3e496dda5ff
      # The emulator reaches the runner's localhost at 10.0.2.2.
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
      # Allows that plain-HTTP address in the release APK (app/app.config.js).
      E2E_BUILD: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      - name: Install app dependencies
        run: npm ci

      # The Android Maps key comes from the EAS production environment, like in release builds.
      # Only prebuild needs it (app.config.js writes it into the manifest); EXPO_TOKEN is
      # removed before any project code runs, and the key is never stored outside this step.
      - name: Generate Android project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas env:pull production --path "$RUNNER_TEMP/eas.env" --non-interactive
          maps_key="$(sed -n 's/^GOOGLE_MAPS_KEY=//p' "$RUNNER_TEMP/eas.env")"
          rm -f "$RUNNER_TEMP/eas.env"
          unset EXPO_TOKEN
          if [ -z "$maps_key" ]; then
            echo "GOOGLE_MAPS_KEY is missing or unreadable in the EAS production environment."
            exit 1
          fi
          echo "::add-mask::$maps_key"
          GOOGLE_MAPS_KEY="$maps_key" npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip
          echo "${RUNNER_TEMP}/maestro/bin" >> "$GITHUB_PATH"

      # A fresh database per run, without a Places key: flows choose their routes on the map.
      # The server keeps running in the background for the following steps.
      - name: Start backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o "$RUNNER_TEMP/catch-me-server" ./cmd/server
          nohup "$RUNNER_TEMP/catch-me-server" -addr :8080 -db "$RUNNER_TEMP/e2e.sqlite" -google-places-api-key="" \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Backend did not become healthy:"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: app
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/ --format junit --output maestro-results/report.xml --debug-output maestro-results/debug --flatten-debug-output

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results
          path: |
            app/maestro-results/
            ${{ runner.temp }}/backend.log
          retention-days: 7
