name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      CGO_ENABLED: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      - name: Install app dependencies
        run: npm ci

      - name: Check Go formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Analyze Go code
        working-directory: backend
        run: go vet ./...

      - name: Check generated API freshness
        run: |
          (cd ../backend && go generate ./cmd/server)
          npm run api:generate
          if [ -n "$(git status --porcelain -- ../backend/api src/api/generated)" ]; then
            git status --short -- ../backend/api src/api/generated
            echo "Generated API files are stale; run go generate and npm run api:generate."
            exit 1
          fi

      - name: Typecheck app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Test frontend API client and generation
        run: npm run test:api

      - name: Bundle Android, iOS, and web
        run: npx expo export --platform all --max-workers 2

      - name: Verify tracked files were not modified
        working-directory: .
        run: git diff --exit-code

  devguard-backend:
    name: DevGuard backend
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: l3montree-dev/devguard-ci-components/.github/workflows/full.yml@0afeae23b8443e4495b88cd0a25723dc469003d4 # v1.18.0
    with:
      devguard-asset-name: catch-me-app/catch-me/catch-me-server
      path: /github/workspace/backend
    secrets:
      devguard-token: ${{ secrets.DEVGUARD_TOKEN }}
      build-args: --context=/github/workspace/backend --dockerfile=/github/workspace/backend/Dockerfile

  devguard-frontend:
    name: DevGuard frontend
    permissions:
      contents: read
    uses: l3montree-dev/devguard-ci-components/.github/workflows/code-scanning.yml@0afeae23b8443e4495b88cd0a25723dc469003d4 # v1.18.0
    with:
      devguard-asset-name: catch-me-app/catch-me/catch-me-app
      path: /github/workspace/app
    secrets:
      devguard-token: ${{ secrets.DEVGUARD_TOKEN }}

  devguard-zizmor:
    name: DevGuard zizmor
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: l3montree-dev/devguard-ci-components/.github/workflows/zizmor-scanning.yml@0afeae23b8443e4495b88cd0a25723dc469003d4 # v1.18.0
    with:
      devguard-asset-name: catch-me-app/catch-me/catch-me-server
    secrets:
      devguard-token: ${{ secrets.DEVGUARD_TOKEN }}
