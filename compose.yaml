name: catch-me

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    command: ["-addr", ":8080", "-web-origin", "${WEB_ORIGIN:-http://localhost:8081}", "-db", "/data/catch-me.sqlite", "-test-skip-start-position-check=${TEST_SKIP_START_POSITION_CHECK:-false}"]
    volumes:
      - game_data:/data
    stop_grace_period: 10s

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8081:8081"
    environment:
      # These addresses must be reachable by the phone/browser, not just Docker.
      EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL:-http://localhost:8080}"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${EXPO_HOST:-localhost}"
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      GOOGLE_MAPS_ANDROID_API_KEY: "${GOOGLE_MAPS_ANDROID_API_KEY:-}"
      BROWSER: none
    volumes:
      - ./app/src:/app/src
      - ./app/assets:/app/assets:ro
      - ./app/app.json:/app/app.json:ro
      - ./app/app.config.js:/app/app.config.js:ro
      - ./app/openapi-ts.config.mjs:/app/openapi-ts.config.mjs:ro
      - ./backend/api:/backend/api:ro
      - expo_state:/home/node/.expo
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true
    init: true

volumes:
  game_data:
  expo_state:
  go_module_cache:
  go_build_cache:
